# Application Registry
# Single source of truth for Mininet-spawnable rural service applications.
# Sourced from RSNSD v1 profiles (frozen reference).
#
# host        service UE base name; with N UEs per service every UE runs the app
# direction   up = UE sends (generator on the UE), down = server sends
# model       traffic/models.py (packet models) or a TCP model in traffic/generator.py
# bitrate_mbps nominal mean rate, used to scale each service to the scenario demand
# dscp        marking applied by the application socket (EF=46, AF41=34, AF31=26,
#             AF21=18, AF11=10, BE=0)
# sla         per-application targets checked by monitoring and labelling

applications:
  # Healthcare (edge cloud)
  - application_id: healthcare.telemedicine
    name: Telemedicine Consultation
    service_class: healthcare
    slice_type: URLLC
    priority: 1
    host: h_health
    server: srv_edge
    server_ip: 10.0.2.10
    port: 5001
    protocol: udp
    direction: up
    model: vbr_video
    params: {rate_mbps: 4.0, fps: 25, gop: 25}
    bitrate_mbps: 4.0
    dscp: 46
    latency_requirement_ms: 50
    sla: {latency_ms: 50, jitter_ms: 10, loss_pct: 1.0}

  - application_id: healthcare.ecg_streaming
    name: ECG Streaming
    service_class: healthcare
    slice_type: URLLC
