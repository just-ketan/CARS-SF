    direction: up
    model: iot_periodic
    params: {period_s: 0.02, size: 200, jitter: 0.02}
    bitrate_mbps: 0.08
    dscp: 46
    latency_requirement_ms: 20
    sla: {latency_ms: 20, jitter_ms: 5, loss_pct: 0.1}

  - application_id: healthcare.emergency_voice
