[pytest]
# MininetSims/ and RSNSDv2/ are deprecated (merged into the root pipeline);
# MininetSims' scenario YAMLs were never committed, so its tests cannot run.
testpaths = tests RSNSD/tests
norecursedirs = MininetSims RSNSDv2 .venv generated legacy
markers =
    integration: runs the real pipeline on an emulated network (needs unshare or root)
    slow: long-running
addopts = -m "not integration"
