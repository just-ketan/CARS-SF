# Mininet-measured SliceNet training set (experiments/collect_dataset.py --merge-only merges it).
defaults:
  duration: 45
  apply_qos: true
  ues_per_service: 2
  scheduler: proposed

studies:
  collect:
    description: Labelled flow windows across operating contexts and seeds.
    grid:
      scenario: [normal, school, harvest, disaster, medical_emergency, fiber_cut]
      seed: [0, 1, 2]
