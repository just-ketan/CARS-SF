    server:
      - address: 127.0.0.4
  session:
    - subnet: 10.60.0.0/24
      gateway: 10.60.0.1
      dnn: health
    - subnet: 10.61.0.0/24
      gateway: 10.61.0.1
      dnn: edu
    - subnet: 10.62.0.0/24
      gateway: 10.62.0.1
      dnn: agri
    - subnet: 10.63.0.0/24
      gateway: 10.63.0.1
      dnn: internet
  dns:
    - 8.8.8.8
  mtu: 1400
